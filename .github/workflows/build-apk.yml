name: Build Learn Talent APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-build-cache --no-configuration-cache --stacktrace --console=plain

      - name: Prepare Debug APK file
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Learn-Talent.apk

      - name: Build Optional Release APK (if keystore secrets are configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache --stacktrace --console=plain
            cp app/build/outputs/apk/release/app-release.apk Learn-Talent-Release.apk
            echo "HAS_RELEASE_APK=true" >> "$GITHUB_ENV"
          else
            echo "Release keystore secrets not configured; Debug APK built cleanly."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Talent-APK
          path: |
            Learn-Talent.apk
            Learn-Talent-Release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="Learn-Talent.apk"
          if [ "${HAS_RELEASE_APK:-false}" = "true" ] && [ -f Learn-Talent-Release.apk ]; then
            FILES="Learn-Talent.apk Learn-Talent-Release.apk"
          fi
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk $FILES --clobber
          else
            gh release create latest-apk $FILES \
              --title "Learn Talent APK (Latest)" \
              --notes "Latest auto-built Android APK for Learn Talent (Offline-First + Google Drive Sync)." \
              --latest
          fi
