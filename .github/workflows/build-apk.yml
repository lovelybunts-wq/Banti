name: Build Learn Talent APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Learn-Talent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Talent-APK
          path: Learn-Talent.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Learn-Talent.apk --clobber
          else
            gh release create latest-apk Learn-Talent.apk \
              --title "Learn Talent APK (Latest)" \
              --notes "Latest auto-built Android APK for Learn Talent." \
              --latest
          fi
