name: Build Learn Talent APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore and verify google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! Add repository secret GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions (paste contents of app/google-services.json from AI Studio)."
            exit 1
          fi
          python3 -c 'import json; json.load(open("app/google-services.json"))' || {
            echo "::error::app/google-services.json is not valid JSON. Please re-paste raw JSON or clean Base64 into GitHub Secret GOOGLE_SERVICES_JSON."
            exit 1
          }

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Learn-Talent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Talent-APK
          path: Learn-Talent.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Learn-Talent.apk --clobber
          else
            gh release create latest-apk Learn-Talent.apk \
              --title "Learn Talent APK (Latest)" \
              --notes "Latest auto-built Android APK for Learn Talent." \
              --latest
          fi
